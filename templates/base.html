<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      name="description"
      content="Surat Styles - Premium B2B Textile Showroom."
    />
    <title>Surat Styles | Wholesale Hub</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}?v=3.0"
    />
  </head>

  <body>
    <nav
      class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-3 d-none d-lg-block"
    >
      <div class="container">
        <a
          class="navbar-brand fw-bold"
          href="/"
          style="font-family: &quot;Playfair Display&quot;, serif"
        >
          <span style="color: #c5a059">👑</span> SURAT STYLES
          <span class="verified-badge" title="Verified Manufacturer">
            <i class="fas fa-check-circle"></i>
          </span>
        </a>
        <div class="ms-auto d-flex align-items-center">
          <a class="nav-link fw-semibold px-3" href="/">Home</a>
          <a class="nav-link fw-semibold px-3" href="/#collection">Catalog</a>
          <a class="nav-link fw-semibold px-3" href="/about">About</a>
          <a class="nav-link fw-semibold px-3" href="/contact">Contact</a>
          {% if current_user.is_authenticated %}
          <a class="btn btn-dark ms-3 rounded-pill px-4" href="/admin"
            >Admin Panel</a
          >
          {% else %}
          <a class="nav-link px-3" href="/login">Login</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <div class="mobile-top-bar d-lg-none bg-white p-3 border-bottom sticky-top">
      <div class="container d-flex justify-content-between align-items-center">
        <a
          class="navbar-brand fw-bold mb-0"
          href="/"
          style="
            font-family: &quot;Playfair Display&quot;, serif;
            font-size: 1.2rem;
          "
        >
          <span style="color: #c5a059">👑</span> SURAT STYLES
          <span class="verified-badge" title="Verified Manufacturer">
            <i class="fas fa-check-circle"></i>
          </span>
        </a>
        <a href="/login" class="text-dark"
          ><i class="fas fa-user-circle fa-lg"></i
        ></a>
      </div>
    </div>

    <main class="content-wrapper">{% block content %}{% endblock %}</main>

    <!-- Enhanced Floating Inquiry Summary Bubble -->
    <div
      class="floating-inquiry-bubble"
      id="floating-inquiry-bubble"
      onclick="scrollToBasket()"
      title="View your inquiry list"
    >
      <i class="fas fa-list"></i>
    </div>

    <div
      id="inquiry-basket"
      class="basket-pro-bar"
      style="display: none"
    >
      <div class="container">
        <div class="basket-info">
          <span class="count-badge" id="inquiry-count">0</span>
          <span class="text-white">Sarees Selected</span>
        </div>
        <button onclick="sendBulkInquiry()" class="btn btn-gold-glow">
          SEND LIST <i class="fab fa-whatsapp ms-1"></i>
        </button>
      </div>
    </div>

    <div class="mobile-bottom-nav d-lg-none">
      <a href="/" class="nav-link-mobile active">
        <i class="fas fa-home"></i><span>Home</span>
      </a>
      <a href="/#collection" class="nav-link-mobile">
        <i class="fas fa-th-large"></i><span>Designs</span>
      </a>
      <a href="https://wa.me/{{ whatsapp_no }}" class="nav-link-mobile">
        <i class="fab fa-whatsapp"></i><span>Chat</span>
      </a>
      {% if current_user.is_authenticated %}
      <a href="/admin" class="nav-link-mobile">
        <i class="fas fa-user-cog"></i><span>Admin</span>
      </a>
      {% else %}
      <a href="/login" class="nav-link-mobile">
        <i class="fas fa-user"></i><span>Login</span>
      </a>
      {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      let selectedItems = [];

      // Initialize floating bubble on page load
      document.addEventListener('DOMContentLoaded', function() {
        updateBasketUI();
      });

      function toggleInquiry(btn) {
        const id = btn.getAttribute("data-id");
        const name = btn.getAttribute("data-name");
        const index = selectedItems.findIndex((item) => item.id === id);

        if (index > -1) {
          selectedItems.splice(index, 1);
          btn.classList.remove("btn-dark");
          btn.classList.add("btn-outline-dark");
          btn.innerHTML = '<i class="fas fa-plus me-1"></i> ADD TO LIST';
        } else {
          selectedItems.push({ id, name });
          btn.classList.remove("btn-outline-dark");
          btn.classList.add("btn-dark");
          btn.innerHTML = '<i class="fas fa-check me-1"></i> ADDED';
        }
        updateBasketUI();
      }

      function updateBasketUI() {
        const basket = document.getElementById("inquiry-basket");
        const countLabel = document.getElementById("inquiry-count");
        const floatingBubble = document.getElementById("floating-inquiry-bubble");
        
        countLabel.innerText = selectedItems.length;
        basket.style.display = selectedItems.length > 0 ? "block" : "none";
        
        // Update floating bubble
        if (selectedItems.length > 0) {
          floatingBubble.classList.add("has-items");
          floatingBubble.setAttribute("data-count", selectedItems.length);
          floatingBubble.innerHTML = `<i class="fas fa-list me-1"></i>${selectedItems.length} designs`;
        } else {
          floatingBubble.classList.remove("has-items");
          floatingBubble.removeAttribute("data-count");
          floatingBubble.innerHTML = '<i class="fas fa-list"></i>';
        }
        
        // On mobile, hide floating bubble when basket is visible (they serve same purpose)
        if (window.innerWidth <= 768) {
          if (selectedItems.length > 0) {
            floatingBubble.style.display = 'none';
          } else {
            floatingBubble.style.display = 'flex';
          }
        } else {
          floatingBubble.style.display = 'flex';
        }
      }
      
      // Update on window resize
      window.addEventListener('resize', updateBasketUI);

      function scrollToBasket() {
        const basket = document.getElementById("inquiry-basket");
        if (selectedItems.length > 0 && basket.style.display !== "none") {
          basket.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      }

      function sendBulkInquiry() {
        if (selectedItems.length === 0) return;
        let message = "Hello, I am interested in these designs:\n\n";
        selectedItems.forEach((item, index) => {
          message += `${index + 1}. D.No: ${item.id} - ${item.name}\n`;
        });
        message += "\nPlease share wholesale prices.";
        window.open(
          `https://wa.me/{{ whatsapp_no }}?text=${encodeURIComponent(message)}`,
          "_blank",
        );
        // Clear selection after sending
        selectedItems = [];
        updateBasketUI();
        // Reset all buttons
        document.querySelectorAll('[data-id]').forEach(btn => {
          btn.classList.replace("btn-dark", "btn-outline-dark");
          btn.innerHTML = '<i class="fas fa-plus me-1"></i> ADD TO LIST';
        });
      }
    </script>
  </body>
</html>
