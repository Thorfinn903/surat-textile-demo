{% extends "base.html" %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-card-header">
            <h4>🔐 Admin Login</h4>
        </div>
        <div class="login-card-body">
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="alert alert-danger mb-4" style="border-radius: 12px; border: none; box-shadow: var(--shadow-soft);">
                        <i class="fas fa-exclamation-circle me-2"></i> {{ messages[0] }}
                    </div>
                {% endif %}
            {% endwith %}

            <form action="/login" method="POST">
                <div class="mb-4">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="admin-btn-large admin-btn-primary w-100">
                    <i class="fas fa-sign-in-alt me-2"></i>Login
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
