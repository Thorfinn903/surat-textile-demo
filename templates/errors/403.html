<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Forbidden | Digital Dukan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Inter', sans-serif; }
        .error-card { background: white; padding: 3rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: center; max-width: 500px; }
        .error-icon { font-size: 4rem; color: #dc3545; margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <div class="error-card border border-danger-subtle">
        <i class="fas fa-lock error-icon"></i>
        <h1 class="fw-bold mb-3 text-dark">Access Denied</h1>
        <p class="text-secondary mb-4">You do not have the required permissions to access this page or perform this action. If you believe this is an error, please contact your administrator.</p>
        <a href="javascript:history.back()" class="btn btn-outline-dark me-2">Go Back</a>
        <a href="/" class="btn btn-dark">Return to Safety</a>
    </div>
</body>
</html>
