<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Upload Saree</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4>🛠️ Admin Panel - Upload New Saree</h4>
            </div>
            <div class="card-body">
                
                <form action="/admin" method="POST" enctype="multipart/form-data">
                    
                    <div class="mb-3">
                        <label class="form-label">Design Number / Name:</label>
                        <input type="text" name="name" class="form-control" placeholder="Ex: Banarasi Silk 101" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Category:</label>
                        <select name="category" class="form-select">
                            <option value="Silk">Silk Saree</option>
                            <option value="Cotton">Cotton Saree</option>
                            <option value="Bridal">Bridal Wear</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Photo Upload Karein:</label>
                        <input type="file" name="image" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-success w-100">Upload & Live 🚀</button>
                    
                </form>
                <div class="mt-3 text-center">
                    <a href="/" class="text-decoration-none">← Back to Website</a>
                </div>

            </div>
        </div>

        <hr class="my-5">

        <h4 class="mb-3">📋 Manage Inventory</h4>

        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Photo</th>
                        <th>Name</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for product in products %}
                    <tr>
                        <td>
                            <img src="{{ url_for('static', filename='images/' + product.image) }}" width="50" height="50" style="object-fit:cover;">
                        </td>
                        <td>{{ product.name }} <br> <small class="text-muted">{{ product.category }}</small></td>
                        <td>
                            {% if product.stock == 'In Stock' %}
                                <span class="badge bg-success">In Stock</span>
                            {% else %}
                                <span class="badge bg-danger">Sold Out</span>
                            {% endif %}
                        </td>
                        <td>
                            <a href="/toggle_stock/{{ product.id }}" class="btn btn-sm btn-warning">
                                Change Stock
                            </a>
                            
                            <a href="/delete/{{ product.id }}" class="btn btn-sm btn-danger" onclick="return confirm('Pakka delete karna hai?')">
                                🗑️
                            </a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    

</body>
</html>
